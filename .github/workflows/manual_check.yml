name: Manual Check Ozon Cancellations

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '开始日期 (YYYY-MM-DD，如 2026-09-01)'
        required: true
        default: '2026-09-01'
      end_date:
        description: '结束日期 (YYYY-MM-DD，如 2026-10-01)'
        required: true
        default: '2026-10-01'

jobs:
  run-manual-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Script
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          python check_ozon_cancellations.py
