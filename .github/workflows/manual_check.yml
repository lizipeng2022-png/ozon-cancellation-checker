name: Manual Check Ozon Cancellations

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run with Maven
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          mvn clean compile exec:java -Dexec.mainClass="com.ozon.OzonCancellationChecker"

      # 将生成的表格文件归档为下载产物
      - name: Upload Claimable Orders CSV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozon-claimable-orders
          path: claimable_orders.csv
          if-no-files-found: ignore
